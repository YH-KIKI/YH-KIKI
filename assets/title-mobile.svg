<svg xmlns="http://www.w3.org/2000/svg" width="440" height="224" viewBox="0 0 440 224" role="img" aria-labelledby="title desc">
  <title id="title">김연희 · AI Engineer</title>
  <desc id="desc">서비스 운영 경험을 바탕으로 AI 기능을 구현하고 검증합니다. 모델과 데이터를 비교하고, API와 사용자 화면까지 연결합니다.</desc>
  <g text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif">
