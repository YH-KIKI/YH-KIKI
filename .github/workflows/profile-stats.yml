name: Refresh profile statistics

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'scripts/update_stats.py'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'YH-KIKI/YH-KIKI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public cards
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/update_stats.py
      - name: Commit changed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: refresh profile statistics'
          git push
